name: Set Bot Description

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Run bot
        run: node index.js
        env:
          DISCORD_TOKEN_HEX: ${{ secrets.DISCORD_TOKEN_HEX }}
